baseURL = 'https://blogs.dvippatel.in/'
locale = 'en-us'
title = "દ્વીપ Blogs"
theme = 'PaperMod'
buildFuture = true

[params]
    DateFormat = "January 2, 2006"
    defaultTheme = "auto" # Changed from auto to dark to test if it's working
    author = "Dvip Patel"
    description = "Personal technical blog by Dvip Patel about AI systems, software engineering, data products, architecture, and project build notes."
    keywords = ["Dvip Patel", "Dvip Patel blog", "AI systems", "software engineering", "data products", "FastAPI", "computer vision", "text to SQL analytics"]
    
    # Theme Features
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true 
    ShowRssButtonInSectionTermList = true
    UseHugoToc = true


[params.profileMode]

  enabled = false
  title = "ExampleSite"
  subtitle = "This is subtitle"
  imageUrl = "<img location>"
  imageWidth = 120
  imageHeight = 120
  imageTitle = "my image"

    [[params.profileMode.buttons]]
    name = "Posts"
    url = "posts"

    [[params.profileMode.buttons]]
    name = "Tags"
    url = "tags"

  [params.homeInfoParams]
  Title = "Dvip Patel"
  Content = "Welcome to my blog. I write about AI systems, software engineering, data products, architecture, and project build notes. If you like what you see, follow along! "

  [[params.socialIcons]]
  name = "x"
  url = "https://x.com/PatelDvip/"

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/dvip-patel-23320a230/"

  [[params.socialIcons]]
  name = "github"
